services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: optiflow_booking
      POSTGRES_USER: optiflow
      POSTGRES_PASSWORD: optiflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optiflow -d optiflow_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  booking:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/optiflow_booking
      SPRING_DATASOURCE_USERNAME: optiflow
      SPRING_DATASOURCE_PASSWORD: optiflow
    ports:
      - "8080:8080"
