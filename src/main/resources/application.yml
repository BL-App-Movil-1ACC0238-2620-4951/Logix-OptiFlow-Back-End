spring:
  application:
    name: optiflow-platform
  profiles:
    default: local
  flyway:
    out-of-order: true
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Lima
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

optiflow:
  security:
    jwt:
      secret: ${JWT_SECRET:optiflow-local-jwt-secret-key-32chars!!}
      expiration: PT24H
  payments:
    mercadopago:
      access-token: ${MERCADOPAGO_ACCESS_TOKEN:}
      webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
      base-url: https://api.mercadopago.com
      notification-url: ${MERCADOPAGO_NOTIFICATION_URL:https://logix-optiflow-back-end.onrender.com/api/v1/payment-notifications}
      back-url: optiflow://payment-result
